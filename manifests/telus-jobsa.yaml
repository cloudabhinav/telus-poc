---
apiVersion: v1
kind: Namespace
metadata:
  name: bm-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bm-register
  namespace: bm-test
---
# Lets the job read exactly one secret in the engine namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bm-register-read-mdcap-secret
  namespace: cno
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["mdcap-env-secrets-cno"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bm-register-read-mdcap-secret
  namespace: cno
subjects:
- kind: ServiceAccount
  name: bm-register
  namespace: bm-test
roleRef:
  kind: Role
  name: bm-register-read-mdcap-secret
  apiGroup: rbac.authorization.k8s.io
---

