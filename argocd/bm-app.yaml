apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cloudabhinav/telus-poc.git
    targetRevision: HEAD
    path: bm-app
  destination:
    server: https://kubernetes.default.svc
    namespace: bm-test
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
