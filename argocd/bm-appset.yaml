apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bm-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/cloudabhinav/telus-poc.git
      revision: HEAD
      directories:
      - path: bms/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/cloudabhinav/telus-poc.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: bm-test
      syncPolicy:
        automated:
          prune: true
        syncOptions:
        - CreateNamespace=true
